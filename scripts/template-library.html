<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Template Library</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0d0d12; color: #e8e8f0; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #a1a1b5; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .card { background: #16161f; border: 1px solid #2a2a3a; border-radius: 12px; overflow: hidden; }
  .frame { aspect-ratio: 16 / 9; position: relative; overflow: hidden; background: #000; }
  .frame iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .info { padding: 12px 14px; }
  .info h2 { font-size: 15px; margin: 0 0 4px; }
  .info p { color: #a1a1b5; font-size: 13px; margin: 0 0 8px; }
  .info a { color: #a78bfa; font-size: 13px; }
  .empty { color: #a1a1b5; }
</style>
</head>
<body>
<main>
  <h1>Template Library</h1>
  <p class="sub">Motion graphics captured from YouTube with YT Motion Capture.</p>
  <div class="grid" id="grid"></div>
</main>
<script src="captures/captured-templates.js"></script>
<script>
const TEMPLATES = [];
if (Array.isArray(window.CAPTURED_TEMPLATES)) {
  TEMPLATES.unshift(...window.CAPTURED_TEMPLATES);
}

const grid = document.getElementById("grid");
if (!TEMPLATES.length) {
  grid.innerHTML = '<p class="empty">No templates yet. On YouTube, mark a Start and End, then click Make template.</p>';
}
for (const t of TEMPLATES) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div class="frame"><iframe loading="lazy"></iframe></div>
    <div class="info"><h2></h2><p></p><a target="_blank">Open template</a></div>`;
  card.querySelector("iframe").src = t.path;
  card.querySelector("h2").textContent = t.name;
  card.querySelector("p").textContent = `${t.duration}s · ${t.desc || ""}`;
  card.querySelector("a").href = t.path;
  grid.appendChild(card);
}

function fit() {
  for (const frame of document.querySelectorAll(".frame")) {
    frame.querySelector("iframe").style.transform = `scale(${frame.clientWidth / 1920})`;
  }
}
new ResizeObserver(fit).observe(grid);
</script>
</body>
</html>
