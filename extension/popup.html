<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YT Motion Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>YT Motion Capture</h1>
    <p class="status" id="status">Checking helper…</p>

  <script src="popup.js"></script>

</html>
